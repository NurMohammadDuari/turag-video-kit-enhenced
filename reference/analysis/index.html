<!doctype html><meta charset="utf-8"><title>Turag: every-frame reference atlas</title><style>body{background:#111318;color:#e9e4d2;font:16px system-ui;margin:24px}input{width:140px;padding:8px}img{max-width:100%;image-rendering:auto}button{padding:8px;margin:6px}a{color:#83aaff}.bar{position:sticky;top:0;background:#111318;padding:8px}</style><h1>Every-frame reference atlas</h1><p>Every decoded frame has a thumbnail. Sheet tiles run left to right, then top to bottom. Each label shows the zero-based frame index and presentation time. Full-resolution details remain in the source video; thumbnails are inspection aids.</p><div class="bar"><button onclick="move(-1)">Previous 100</button><input id="f" type="number" min="0" value="0"><button onclick="go()">Go to frame</button><button onclick="move(1)">Next 100</button> <span id="s"></span></div><img id="im"><script>const count=19115;let page=0;function show(){page=Math.max(0,Math.min(Math.ceil(count/100)-1,page));document.getElementById('im').src='atlas/frames_'+String(page).padStart(3,'0')+'.jpg';document.getElementById('s').textContent='Frames '+(page*100)+'–'+Math.min(count-1,page*100+99)+' of '+count}function go(){page=Math.floor(Number(document.getElementById('f').value)/100);show()}function move(n){page+=n;show()}show()</script>
