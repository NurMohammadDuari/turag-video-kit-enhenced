<!doctype html><meta charset="utf-8"><title>Animation lab</title>
<style>body{margin:24px;background:#12141c;color:#e9e4d2;font:16px system-ui}canvas{width:min(100%,1200px);display:block;background:#e9e4d2;margin-top:16px}button,select,input{font:inherit;margin:8px;padding:8px}label{display:inline-block}p{max-width:1000px}</style>
<h1>Animation lab</h1><p>Inspect shared acting before using it in an episode. Scrub through contact and transitions. Red dots mark the exact hand sockets; held paper follows the right wrist. Turn off markers to inspect the silhouette.</p>
<label>Action <select id="action"></select></label><label>Facing <select id="facing"><option value="1">Right</option><option value="-1">Left</option></select></label><label><input id="markers" type="checkbox" checked>Contact markers</label><button id="play">Play</button><label>Time <input id="time" type="range" min="0" max="8" step=".01" value="0"><output id="clock">0.00</output></label>
<canvas id="c" width="1200" height="650"></canvas>
<script src="characters.js"></script><script>
const H=TuragCharacters,c=document.getElementById('c'),ctx=c.getContext('2d'),select=document.getElementById('action'),slider=document.getElementById('time');
for(const name of ['sequence',...H.actionNames()])select.add(new Option(name,name));
const actions=[{at:0,action:'take',blend:.25},{at:2,action:'read',blend:.4},{at:4,action:'point',blend:.4},{at:6,action:'rest',blend:.5}];
let playing=false,now=0,last=0;window.__qa={errors:[]};window.DURATION=8;
window.seek=function(t){now=t;ctx.fillStyle='#E9E4D2';ctx.fillRect(0,0,c.width,c.height);ctx.font='16px sans-serif';ctx.fillStyle='#12141c';ctx.fillText('Shared rig · standing / seated / coat / dress',30,35);
 for(let i=0;i<4;i++){const x=160+i*290,y=530,o={x,y,h:300,t,actionTime:t,action:select.value==='sequence'?'rest':select.value,actions:select.value==='sequence'?actions:undefined,pose:i===1?'sit':'stand',role:i===2?'doctor':'extra',variant:i===3?1:0,dir:Number(document.getElementById('facing').value)};ctx.strokeStyle='#9b978b';ctx.beginPath();ctx.moveTo(x-120,y);ctx.lineTo(x+120,y);ctx.stroke();H.draw(ctx,o);const wrist=H.socket(o,'rightHand');ctx.save();ctx.translate(x+wrist[0],y+wrist[1]);ctx.fillStyle='#e9e4d2';ctx.strokeStyle='#12141c';ctx.fillRect(-12,-28,24,28);ctx.strokeRect(-12,-28,24,28);ctx.restore();if(document.getElementById('markers').checked)for(const side of ['leftHand','rightHand']){const p=H.socket(o,side);ctx.fillStyle='#ff3d17';ctx.beginPath();ctx.arc(x+p[0],y+p[1],3,0,Math.PI*2);ctx.fill();}ctx.fillStyle='#12141c';ctx.fillText(['standing','seated','doctor','dress'][i],x-35,575);}
 slider.value=t;document.getElementById('clock').value=t.toFixed(2);};
select.onchange=()=>seek(now);document.getElementById('facing').onchange=()=>seek(now);document.getElementById('markers').onchange=()=>seek(now);slider.oninput=()=>{playing=false;seek(Number(slider.value));document.getElementById('play').textContent='Play'};document.getElementById('play').onclick=()=>{playing=!playing;document.getElementById('play').textContent=playing?'Pause':'Play'};seek(0);window.__ready=true;requestAnimationFrame(function tick(t){if(playing)seek((now+Math.min(.1,(t-last)/1000))%8);last=t;requestAnimationFrame(tick)});
</script>
